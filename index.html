<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Website</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@700&family=Lora:wght@700&display=swap"
    rel="stylesheet">
</head>

<body>

  <header>
    <div class="container header-layout">
      <div class="logo">Logo</div>
      <div class="menu">Menu</div>
      <div class="button">Button</div>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-layout">
      <div class="hero-content">Content</div>
      <div class="hero-image">Image</div>
    </div>
  </section>

  <section class="grid-section">
    <div class="container">
      <div class="section-title">Title</div>
      <div class="grid-3-cols">
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
      </div>
    </div>
  </section>

  <section class="grid-section-2">
    <div class="container">
      <div class="section-title">Title</div>
      <div class="grid-5-cols">
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
      </div>
    </div>
  </section>

  <section class="grid-section-3">
    <div class="container">
      <div class="section-title">Title</div>
      <div class="grid-4-cols">
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
        <div class="item">Item</div>
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-content">Footer</div>
  </footer>

</body>

</html>
